<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Vendedores - Distribuidora</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-2xl mx-auto min-h-screen bg-white shadow-lg flex flex-col">
        
        <!-- HEADER -->
        <header class="bg-slate-800 text-white p-4 text-center font-bold text-lg">
            Panel de Control - Vendedores
        </header>

        <!-- CONTENIDO -->
        <div class="p-4 flex-1">
            
            <!-- SECCIÓN: GESTIÓN DE PRODUCTOS Y PRECIOS -->
            <div class="bg-gray-50 p-4 rounded-lg border mb-6 shadow-sm">
                <h2 class="text-lg font-bold text-gray-800 mb-3">📦 Agregar / Actualizar Producto</h2>
                <form id="form-producto" onsubmit="guardarProducto(event)" class="space-y-3 text-xs">
                    <div>
                        <label class="block text-gray-600 mb-1 font-semibold">Nombre del Producto:</label>
                        <input type="text" id="prod-nombre" class="w-full border p-2 rounded bg-white" required placeholder="Ej: Harina 1kg">
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-gray-600 mb-1 font-semibold">Stock:</label>
                            <input type="number" id="prod-stock" class="w-full border p-2 rounded bg-white" required placeholder="100">
                        </div>
                        <div>
                            <label class="block text-gray-600 mb-1 font-semibold">Precio Normal:</label>
                            <input type="number" id="prod-precio" step="0.01" class="w-full border p-2 rounded bg-white" required placeholder="0.00">
                        </div>
                        <div>
                            <label class="block text-gray-600 mb-1 font-semibold">Precio Mayorista:</label>
                            <input type="number" id="prod-precio-mayorista" step="0.01" class="w-full border p-2 rounded bg-white" placeholder="Opcional">
                        </div>
                    </div>
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded font-semibold hover:bg-indigo-700 w-full transition">Guardar Producto</button>
                </form>
            </div>

            <!-- SECCIÓN: PEDIDOS -->
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">Pedidos Ingresados</h2>
                <button onclick="cargarPedidos()" class="bg-blue-600 text-white text-sm px-3 py-1.5 rounded hover:bg-blue-700">Actualizar</button>
            </div>

            <!-- FILTRO POR FECHAS -->
            <div class="bg-gray-50 p-3 rounded-lg border mb-4 flex flex-wrap gap-2 items-end text-xs">
                <div>
                    <label class="block text-gray-600 mb-1 font-semibold">Desde:</label>
                    <input type="date" id="filtro-desde" class="border p-1.5 rounded bg-white">
                </div>
                <div>
                    <label class="block text-gray-600 mb-1 font-semibold">Hasta:</label>
                    <input type="date" id="filtro-hasta" class="border p-1.5 rounded bg-white">
                </div>
                <button onclick="filtrarPorFecha()" class="bg-slate-700 text-white px-3 py-2 rounded font-semibold hover:bg-slate-800">Filtrar</button>
                <button onclick="limpiarFiltro()" class="text-gray-500 underline py-2">Limpiar</button>
            </div>

            <!-- Listado de Pedidos -->
            <div id="lista-pedidos" class="space-y-3">
                <p class="text-gray-500 text-center py-6">Cargando pedidos...</p>
            </div>

            <!-- SECCIÓN DE REPORTES -->
            <div class="border-t mt-6 pt-4 bg-gray-50 p-3 rounded-lg">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold text-gray-800">📊 Reportes de Ventas</h2>
                    <button onclick="exportarExcel()" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded font-bold hover:bg-emerald-700">📥 Exportar a Excel (CSV)</button>
                </div>
                <div class="flex space-x-2 mb-3">
                    <button onclick="cargarReporte('mensual')" class="bg-slate-700 text-white text-xs px-3 py-1.5 rounded">Mensual</button>
                    <button onclick="cargarReporte('anual')" class="bg-slate-700 text-white text-xs px-3 py-1.5 rounded">Anual</button>
                </div>
                <div id="contenedor-reporte" class="bg-white p-3 rounded border text-sm text-gray-700">
                    <p class="text-gray-400 text-center">Selecciona un reporte para visualizar.</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_URL = "https://distruibuidora-b2b.onrender.com/api";
        let ultimosPedidos = [];

        async function guardarProducto(event) {
            event.preventDefault();
            const nombre = document.getElementById("prod-nombre").value;
            const stock = parseInt(document.getElementById("prod-stock").value);
            const precio = parseFloat(document.getElementById("prod-precio").value);
            const precio_mayorista = parseFloat(document.getElementById("prod-precio-mayorista").value) || 0;

            try {
                const res = await fetch(`${API_URL}/productos`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nombre, stock, precio, precio_mayorista })
                });

                if (res.ok) {
                    alert("¡Producto guardado con éxito!");
                    document.getElementById("form-producto").reset();
                } else {
                    alert("Error al guardar el producto.");
                }
            } catch (err) {
                alert("No se pudo conectar con el servidor.");
            }
        }

        async function cargarPedidos(desde = '', hasta = '') {
            const contenedor = document.getElementById("lista-pedidos");
            try {
                let url = `${API_URL}/pedidos`;
                if (desde && hasta) {
                    url += `?desde=${desde}&hasta=${hasta}`;
                }

                const res = await fetch(url);
                ultimosPedidos = await res.json();

                if (ultimosPedidos.length === 0) {
                    contenedor.innerHTML = `<p class="text-gray-500 text-center py-6">No hay pedidos registrados en este rango.</p>`;
                    return;
                }

                contenedor.innerHTML = "";
                ultimosPedidos.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "border p-4 rounded-lg shadow-sm bg-white";
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs bg-green-100 text-green-800 font-bold px-2 py-0.5 rounded">Pedido #${p.pedido_id}</span>
                                <h4 class="font-bold text-gray-800 mt-1">${p.nombre_comercio}</h4>
                                <p class="text-xs text-gray-500">Fecha: ${p.fecha}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-bold text-lg text-gray-900">$${p.total.toFixed(2)}</p>
                                <span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded font-semibold">${p.estado}</span>
                            </div>
                        </div>

                        <!-- Botones de Acción y Ver Detalle -->
                        <div class="mt-3 pt-3 border-t flex justify-between items-center">
                            <div class="space-x-1">
                                <button onclick="cambiarEstado(${p.pedido_id}, 'Aprobado')" class="bg-blue-500 text-white text-xs px-2.5 py-1 rounded hover:bg-blue-600">Aprobar</button>
                                <button onclick="cambiarEstado(${p.pedido_id}, 'Entregado')" class="bg-green-600 text-white text-xs px-2.5 py-1 rounded hover:bg-green-700">Entregar</button>
                            </div>
                            <button onclick="toggleDetalle(${p.pedido_id})" class="text-xs text-blue-600 underline font-semibold">Ver detalle 📋</button>
                        </div>

                        <!-- Contenedor Oculto para el Detalle del Pedido -->
                        <div id="detalle-${p.pedido_id}" class="hidden mt-3 pt-3 border-t border-dashed text-sm text-gray-700">
                            <p class="text-center text-gray-400">Cargando productos...</p>
                        </div>
                    `;
                    contenedor.appendChild(div);
                });

            } catch (err) {
                contenedor.innerHTML = `<p class="text-red-500 text-center py-6">Error al conectar con el servidor.</p>`;
            }
        }

        function filtrarPorFecha() {
            const desde = document.getElementById("filtro-desde").value;
            const hasta = document.getElementById("filtro-hasta").value;
            if (!desde || !hasta) {
                alert("Por favor selecciona ambas fechas.");
                return;
            }
            cargarPedidos(desde, hasta);
        }

        function limpiarFiltro() {
            document.getElementById("filtro-desde").value = "";
            document.getElementById("filtro-hasta").value = "";
            cargarPedidos();
        }

        async function toggleDetalle(pedidoId) {
            const contenedorDetalle = document.getElementById(`detalle-${pedidoId}`);
            if (!contenedorDetalle.classList.contains("hidden")) {
                contenedorDetalle.classList.add("hidden");
                return;
            }
            contenedorDetalle.classList.remove("hidden");
            
            try {
                const res = await fetch(`${API_URL}/pedidos/${pedidoId}/detalle`);
                const items = await res.json();

                let html = `<table class="w-full text-left text-xs mb-2">
                    <tr class="border-b font-bold text-gray-600">
                        <th class="py-1">Producto</th>
                        <th class="text-center">Cant</th>
                        <th class="text-right">Unitario</th>
                        <th class="text-right">Subtotal</th>
                    </tr>`;

                items.forEach(i => {
                    html += `
                        <tr class="border-b border-gray-100">
                            <td class="py-1">${i.producto}</td>
                            <td class="text-center">${i.cantidad}</td>
                            <td class="text-right">$${i.precio_unitario.toFixed(2)}</td>
                            <td class="text-right font-semibold">$${i.subtotal.toFixed(2)}</td>
                        </tr>`;
                });
                html += `</table>`;
                contenedorDetalle.innerHTML = html;
            } catch (err) {
                contenedorDetalle.innerHTML = `<p class="text-red-500 text-xs">No se pudo cargar el detalle.</p>`;
            }
        }

        async function cambiarEstado(pedidoId, nuevoEstado) {
            try {
                await fetch(`${API_URL}/pedidos/${pedidoId}/estado`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ estado: nuevoEstado })
                });
                const desde = document.getElementById("filtro-desde").value;
                const hasta = document.getElementById("filtro-hasta").value;
                cargarPedidos(desde, hasta);
            } catch (err) {
                alert("No se pudo actualizar el estado.");
            }
        }

        async function cargarReporte(tipo) {
            const contenedor = document.getElementById("contenedor-reporte");
            contenedor.innerHTML = `<p class="text-gray-400 text-center">Cargando reporte...</p>`;
            try {
                const res = await fetch(`${API_URL}/reportes/${tipo}`);
                const datos = await res.json();

                if (datos.length === 0) {
                    contenedor.innerHTML = `<p class="text-gray-500 text-center">No hay datos suficientes.</p>`;
                    return;
                }

                let html = `<table class="w-full text-left text-xs">
                    <tr class="border-b font-bold text-gray-600">
                        <th class="py-1">${tipo === 'mensual' ? 'Mes' : 'Año'}</th>
                        <th class="text-center">Cant. Pedidos</th>
                        <th class="text-right">Ingresos Totales</th>
                    </tr>`;

                datos.forEach(d => {
                    html += `
                        <tr class="border-b border-gray-100">
                            <td class="py-1 font-semibold">${d.periodo}</td>
                            <td class="text-center">${d.total_pedidos}</td>
                            <td class="text-right font-bold text-green-600">$${d.ingresos_totales.toFixed(2)}</td>
                        </tr>`;
                });
                html += `</table>`;
                contenedor.innerHTML = html;
            } catch (err) {
                contenedor.innerHTML = `<p class="text-red-500 text-center">Error al generar reporte.</p>`;
            }
        }

        function exportarExcel() {
            if (ultimosPedidos.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,ID Pedido,Comercio,Total,Estado,Fecha\n";
            ultimosPedidos.forEach(p => {
                csvContent += `${p.pedido_id},"${p.nombre_comercio}",${p.total},${p.estado},"${p.fecha}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "reporte_pedidos.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        cargarPedidos();
    </script>
</body>
</html>
