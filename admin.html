<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Distribuidora</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-y-screen p-6">
    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Cabecera -->
        <div class="bg-white shadow rounded-lg p-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Panel de Administración B2B</h1>
            <a href="index.html" class="text-blue-600 hover:underline font-medium">Ir a la Tienda</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Formulario para Cargar Producto (con 4 precios) -->
            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Agregar Nuevo Producto</h2>
                <form id="form-producto" onsubmit="guardarProducto(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Nombre del Producto</label>
                        <input type="text" id="prod-nombre" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Stock Inicial</label>
                        <input type="number" id="prod-stock" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-500">Precio Nivel 1</label>
                            <input type="number" step="0.01" id="prod-p1" required class="w-full mt-1 p-2 border rounded-md">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500">Precio Nivel 2</label>
                            <input type="number" step="0.01" id="prod-p2" required class="w-full mt-1 p-2 border rounded-md">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500">Precio Nivel 3</label>
                            <input type="number" step="0.01" id="prod-p3" required class="w-full mt-1 p-2 border rounded-md">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500">Precio Nivel 4</label>
                            <input type="number" step="0.01" id="prod-p4" required class="w-full mt-1 p-2 border rounded-md">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 font-medium">Guardar Producto</button>
                </form>
                <p id="msg-producto" class="mt-3 text-sm text-center font-medium"></p>
            </div>

            <!-- Formulario para Cargar Cliente -->
            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Registrar Nuevo Cliente</h2>
                <form id="form-cliente" onsubmit="guardarCliente(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Nombre de la Empresa / Cliente</label>
                        <input type="text" id="cli-nombre" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Usuario de Acceso</label>
                        <input type="text" id="cli-usuario" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Contraseña</label>
                        <input type="password" id="cli-password" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Nivel de Precio Asignado</label>
                        <select id="cli-nivel" class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300">
                            <option value="1">Nivel 1 (Minorista)</option>
                            <option value="2">Nivel 2 (Mayorista)</option>
                            <option value="3">Nivel 3 (Distribuidor)</option>
                            <option value="4">Nivel 4 (Especial)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white p-2 rounded-md hover:bg-green-700 font-medium">Registrar Cliente</button>
                </form>
                <p id="msg-cliente" class="mt-3 text-sm text-center font-medium"></p>
            </div>

        </div>
    </div>

    <script>
        const API_URL = ""; // Si subes todo al mismo dominio de Render, se deja vacío

        async function guardarProducto(event) {
            event.preventDefault();
            const data = {
                nombre: document.getElementById('prod-nombre').value,
                stock: parseInt(document.getElementById('prod-stock').value),
                precio_1: parseFloat(document.getElementById('prod-p1').value),
                precio_2: parseFloat(document.getElementById('prod-p2').value),
                precio_3: parseFloat(document.getElementById('prod-p3').value),
                precio_4: parseFloat(document.getElementById('prod-p4').value)
            };

            const res = await fetch(`${API_URL}/api/productos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const msg = document.getElementById('msg-producto');
            if (res.ok) {
                msg.textContent = "¡Producto guardado con éxito!";
                msg.className = "mt-3 text-sm text-center font-medium text-green-600";
                document.getElementById('form-producto').reset();
            } else {
                msg.textContent = "Error al guardar el producto.";
                msg.className = "mt-3 text-sm text-center font-medium text-red-600";
            }
        }

        async function guardarCliente(event) {
            event.preventDefault();
            const data = {
                nombre: document.getElementById('cli-nombre').value,
                usuario: document.getElementById('cli-usuario').value,
                password: document.getElementById('cli-password').value,
                tipo_precio: document.getElementById('cli-nivel').value
            };

            const res = await fetch(`${API_URL}/api/clientes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const msg = document.getElementById('msg-cliente');
            if (res.ok) {
                msg.textContent = "¡Cliente registrado con éxito!";
                msg.className = "mt-3 text-sm text-center font-medium text-green-600";
                document.getElementById('form-cliente').reset();
            } else {
                const err = await res.json();
                msg.textContent = err.detail || "Error al registrar el cliente.";
                msg.className = "mt-3 text-sm text-center font-medium text-red-600";
            }
        }
    </script>
</body>
</html>
