<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold">Panel Administrador</h1>

        <!-- Pestañas -->
        <div class="flex space-x-4 border-b pb-2">
            <button onclick="verTab('productos')" class="font-bold text-blue-600">Productos</button>
            <button onclick="verTab('pedidos')" class="font-bold text-gray-600">Pedidos</button>
        </div>

        <!-- PRODUCTOS -->
        <div id="tab-productos" class="space-y-6">
            <!-- Formulario para agregar productos -->
            <div class="bg-white p-4 rounded shadow space-y-4">
                <h2 class="text-lg font-bold border-b pb-2">Cargar Nuevo Producto</h2>
                <form id="form-producto" onsubmit="guardarProducto(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase">Nombre</label>
                        <input type="text" id="p-nombre" required class="w-full border p-2 rounded text-sm mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase">Stock Inicial</label>
                        <input type="number" id="p-stock" required min="0" class="w-full border p-2 rounded text-sm mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase">Precio Lista 1</label>
                        <input type="number" step="0.01" id="p-p1" required min="0" class="w-full border p-2 rounded text-sm mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase">Precio Lista 2</label>
                        <input type="number" step="0.01" id="p-p2" required min="0" class="w-full border p-2 rounded text-sm mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase">Precio Lista 3</label>
                        <input type="number" step="0.01" id="p-p3" required min="0" class="w-full border p-2 rounded text-sm mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase">Precio Lista 4</label>
                        <input type="number" step="0.01" id="p-p4" required min="0" class="w-full border p-2 rounded text-sm mt-1">
                    </div>
                    <div class="sm:col-span-2 md:col-span-3">
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded text-sm transition">Guardar Producto</button>
                    </div>
                </form>
            </div>

            <!-- Tabla de productos -->
            <div>
                <h2 class="text-lg font-bold mb-2">Lista de Productos</h2>
                <table class="w-full bg-white rounded shadow text-left">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="p-2">ID</th>
                            <th class="p-2">Nombre</th>
                            <th class="p-2">Stock</th>
                            <th class="p-2">Lista 1</th>
                            <th class="p-2">Lista 2</th>
                            <th class="p-2">Lista 3</th>
                            <th class="p-2">Lista 4</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-prod"></tbody>
                </table>
            </div>
        </div>

        <!-- PEDIDOS -->
        <div id="tab-pedidos" class="hidden space-y-4">
            <div class="flex space-x-4">
                <input type="text" id="buscar-cliente" oninput="filtrarPedidos()" placeholder="Buscar cliente..." class="border p-2 rounded w-1/2">
                
                <select id="filtro-estado" onchange="filtrarPedidos()" class="border p-2 rounded">
                    <option value="todos">Todos los estados</option>
                    <option value="pendiente">Pendientes</option>
                    <option value="procesando">En proceso</option>
                    <option value="entregado">Entregados</option>
                </select>
            </div>

            <table class="w-full bg-white rounded shadow text-left">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="p-2"># ID</th>
                        <th class="p-2">Cliente</th>
                        <th class="p-2">Lista</th>
                        <th class="p-2">Detalle</th>
                        <th class="p-2">Estado</th>
                        <th class="p-2 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-pedidos"></tbody>
            </table>
        </div>
    </div>

    <script>
        let pedidosOriginales = [];

        function verTab(tab) {
            document.getElementById('tab-productos').classList.toggle('hidden', tab !== 'productos');
            document.getElementById('tab-pedidos').classList.toggle('hidden', tab !== 'pedidos');
            if (tab === 'productos') cargarProductos();
            if (tab === 'pedidos') cargarPedidos();
        }

        async function cargarProductos() {
            try {
                const res = await fetch('/api/productos');
                const data = await res.json();
                const tbody = document.getElementById('tabla-prod');
                tbody.innerHTML = data.map(p => `
                    <tr class="border-b">
                        <td class="p-2">${p.id}</td>
                        <td class="p-2 font-bold">${p.nombre}</td>
                        <td class="p-2">${p.stock}</td>
                        <td class="p-2 text-blue-600 font-bold">$${p.precio_1 ?? 0}</td>
                        <td class="p-2 text-blue-600 font-bold">$${p.precio_2 ?? 0}</td>
                        <td class="p-2 text-blue-600 font-bold">$${p.precio_3 ?? 0}</td>
                        <td class="p-2 text-blue-600 font-bold">$${p.precio_4 ?? 0}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error("Error al cargar productos:", e);
            }
        }

        async function guardarProducto(e) {
            e.preventDefault();
            const body = {
                nombre: document.getElementById('p-nombre').value,
                stock: parseInt(document.getElementById('p-stock').value),
                precio_1: parseFloat(document.getElementById('p-p1').value),
                precio_2: parseFloat(document.getElementById('p-p2').value),
                precio_3: parseFloat(document.getElementById('p-p3').value),
                precio_4: parseFloat(document.getElementById('p-p4').value)
            };

            try {
                const res = await fetch('/api/productos', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                if(res.ok) {
                    alert('Producto guardado correctamente');
                    document.getElementById('form-producto').reset();
                    cargarProductos();
                }
            } catch(err) {
                alert('Error al guardar el producto');
            }
        }

        async function cargarPedidos() {
            try {
                const res = await fetch('/api/pedidos');
                pedidosOriginales = await res.json();
                filtrarPedidos();
            } catch (e) {
                console.error("Error al cargar pedidos:", e);
            }
        }

        function filtrarPedidos() {
            const busqueda = document.getElementById('buscar-cliente').value.toLowerCase().trim();
            const filtroEstado = document.getElementById('filtro-estado').value.toLowerCase().trim();

            const filtrados = pedidosOriginales.filter(p => {
                const cliente = (p.cliente || '').toLowerCase();
                const estado = (p.estado || 'pendiente').toLowerCase();

                const coincideCliente = cliente.includes(busqueda);
                const coincideEstado = (filtroEstado === 'todos') || estado.includes(filtroEstado);

                return coincideCliente && coincideEstado;
            });

            const tbody = document.getElementById('tabla-pedidos');
            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">No hay pedidos para mostrar.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtrados.map(p => {
                const est = (p.estado || 'pendiente').toLowerCase();
                return `
                    <tr class="border-b">
                        <td class="p-2 font-bold">#${p.id}</td>
                        <td class="p-2">${p.cliente}</td>
                        <td class="p-2 text-xs font-bold">Lista ${p.lista_precio || 1}</td>
                        <td class="p-2 text-xs">${p.detalle}</td>
                        <td class="p-2">
                            <select onchange="cambiarEstado(${p.id}, this.value)" class="border p-1 rounded text-xs font-bold">
                                <option value="pendiente" ${est === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                                <option value="procesando" ${est === 'procesando' ? 'selected' : ''}>En proceso</option>
                                <option value="entregado" ${est === 'entregado' ? 'selected' : ''}>Entregado</option>
                            </select>
                        </td>
                        <td class="p-2 text-center">
                            <button onclick="eliminarPedido(${p.id})" class="bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-2 rounded text-xs transition">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function cambiarEstado(id, nuevoEstado) {
            try {
                const res = await fetch(`/api/pedidos/${id}/estado`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ estado: nuevoEstado })
                });
                if (res.ok) {
                    const p = pedidosOriginales.find(x => x.id === id);
                    if (p) p.estado = nuevoEstado;
                } else {
                    alert('Error al actualizar el estado');
                }
            } catch (err) {
                alert('Error de red al actualizar estado');
            }
        }

        async function eliminarPedido(id) {
            if (!confirm(`¿Estás seguro de que deseas eliminar el pedido #${id}?`)) return;

            try {
                const res = await fetch(`/api/pedidos/${id}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    pedidosOriginales = pedidosOriginales.filter(x => x.id !== id);
                    filtrarPedidos();
                } else {
                    alert('Error al eliminar el pedido');
                }
            } catch (err) {
                alert('Error de red al eliminar el pedido');
            }
        }

        cargarProductos();
    </script>
</body>
</html>
