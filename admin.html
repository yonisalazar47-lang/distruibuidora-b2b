<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold">Panel Administrador</h1>

        <!-- Pestañas -->
        <div class="flex space-x-4 border-b pb-2">
            <button onclick="verTab('productos')" class="font-bold text-blue-600">Productos</button>
            <button onclick="verTab('pedidos')" class="font-bold text-gray-600">Pedidos</button>
        </div>

        <!-- PRODUCTOS -->
        <div id="tab-productos">
            <h2 class="text-lg font-bold mb-2">Lista de Productos</h2>
            <table class="w-full bg-white rounded shadow text-left">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="p-2">ID</th>
                        <th class="p-2">Nombre</th>
                        <th class="p-2">Stock</th>
                        <th class="p-2">Precio</th>
                    </tr>
                </thead>
                <tbody id="tabla-prod"></tbody>
            </table>
        </div>

        <!-- PEDIDOS -->
        <div id="tab-pedidos" class="hidden space-y-4">
            <div class="flex space-x-4">
                <input type="text" id="buscar-cliente" oninput="filtrarPedidos()" placeholder="Buscar cliente..." class="border p-2 rounded w-1/2">
                <select id="filtro-estado" onchange="filtrarPedidos()" class="border p-2 rounded">
                    <option value="todos">Todos los estados</option>
                    <option value="pendiente">Pendientes</option>
                    <option value="entregado">Entregados</option>
                    <option value="procesando">En proceso</option>
                </select>
            </div>

            <table class="w-full bg-white rounded shadow text-left">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="p-2"># ID</th>
                        <th class="p-2">Cliente</th>
                        <th class="p-2">Lista</th>
                        <th class="p-2">Detalle</th>
                        <th class="p-2">Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-pedidos"></tbody>
            </table>
        </div>
    </div>

    <script>
        let pedidos = [];

        function verTab(tab) {
            document.getElementById('tab-productos').classList.toggle('hidden', tab !== 'productos');
            document.getElementById('tab-pedidos').classList.toggle('hidden', tab !== 'pedidos');
            if (tab === 'productos') cargarProductos();
            if (tab === 'pedidos') cargarPedidos();
        }

        async function cargarProductos() {
            const res = await fetch('/api/productos');
            const data = await res.json();
            const tbody = document.getElementById('tabla-prod');
            tbody.innerHTML = data.map(p => `
                <tr class="border-b">
                    <td class="p-2">${p.id}</td>
                    <td class="p-2">${p.nombre}</td>
                    <td class="p-2">${p.stock}</td>
                    <td class="p-2">$${p.precio ?? p.precio_1 ?? 0}</td>
                </tr>
            `).join('');
        }

        async function cargarPedidos() {
            const res = await fetch('/api/pedidos');
            pedidos = await res.json();
            filtrarPedidos();
        }

        function filtrarPedidos() {
            const busqueda = document.getElementById('buscar-cliente').value.toLowerCase();
            const estado = document.getElementById('filtro-estado').value.toLowerCase();

            const filtrados = pedidos.filter(p => {
                const matchCliente = (p.cliente || '').toLowerCase().includes(busqueda);
                const matchEstado = (estado === 'todos') || (p.estado || '').toLowerCase().includes(estado);
                return matchCliente && matchEstado;
            });

            const tbody = document.getElementById('tabla-pedidos');
            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center">No hay pedidos para mostrar</td></tr>`;
                return;
            }

            tbody.innerHTML = filtrados.map(p => `
                <tr class="border-b">
                    <td class="p-2">#${p.id}</td>
                    <td class="p-2">${p.cliente}</td>
                    <td class="p-2">Lista ${p.lista_precio || 1}</td>
                    <td class="p-2 text-xs">${p.detalle}</td>
                    <td class="p-2 font-bold">${p.estado || 'pendiente'}</td>
                </tr>
            `).join('');
        }

        cargarProductos();
    </script>
</body>
</html>
