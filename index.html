<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Pedidos - Distribuidora</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">
        
        <!-- HEADER -->
        <header class="bg-blue-600 text-white p-4 text-center font-bold text-lg">
            Distribuidora B2B
        </header>

        <!-- SECCIÓN 1: LOGIN -->
        <div id="login-section" class="p-6 flex-1 flex flex-col justify-center">
            <h2 class="text-xl font-bold mb-4 text-gray-800 text-center">Acceso Clientes</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-600 mb-1">Usuario</label>
                    <input type="text" id="usuario" required class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">Contraseña</label>
                    <input type="password" id="password" required class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700">Ingresar</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-2 text-center hidden">Usuario o contraseña incorrectos</p>
        </div>

        <!-- SECCIÓN 2: CATALOGO Y PEDIDOS -->
        <div id="catalog-section" class="p-4 flex-1 hidden flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <div>
                    <h3 id="nombre-comercio" class="font-bold text-gray-800"></h3>
                    <span class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded">Catálogo Exclusivo</span>
                </div>
                <button id="btn-logout" class="text-sm text-red-500 underline">Salir</button>
            </div>

            <!-- Lista de Productos -->
            <div id="productos-lista" class="space-y-3 flex-1 overflow-y-auto mb-4"></div>

            <!-- Resumen y Enviar Pedido -->
            <div class="border-t pt-3 bg-gray-50 p-3 rounded-lg">
                <div class="flex justify-between font-bold text-lg mb-2">
                    <span>Total estimado:</span>
                    <span id="total-pedido">$0.00</span>
                </div>
                <button id="btn-enviar" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700 disabled:opacity-50" disabled>
                    Confirmar Pedido
                </button>
            </div>
        </div>

    </div>

    <script>
        const API_URL = "https://distruibuidora-b2b.onrender.com/api";
        let clienteActual = null;
        let catalogoProductos = [];
        let carrito = {};

        const loginSection = document.getElementById("login-section");
        const catalogSection = document.getElementById("catalog-section");
        const loginForm = document.getElementById("login-form");
        const loginError = document.getElementById("login-error");
        const productosLista = document.getElementById("productos-lista");
        const nombreComercioElem = document.getElementById("nombre-comercio");
        const totalPedidoElem = document.getElementById("total-pedido");
        const btnEnviar = document.getElementById("btn-enviar");

        loginForm.addEventListener("submit", async function(e) {
            e.preventDefault();
            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value.trim();

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario, password })
                });

                if (!res.ok) throw new Error("Credenciales inválidas");

                clienteActual = await res.json();
                loginError.classList.add("hidden");
                loginSection.classList.add("hidden");
                catalogSection.classList.remove("hidden");

                nombreComercioElem.textContent = clienteActual.nombre;
                
                // Cargamos el catálogo pasando la categoría de precio del cliente
                cargarCatalogo(clienteActual.tipo_precio);
            } catch (err) {
                loginError.classList.remove("hidden");
            }
        });

        async function cargarCatalogo(tipoPrecio) {
            try {
                const res = await fetch(`${API_URL}/productos?tipo_precio=${tipoPrecio}`);
                catalogoProductos = await res.json();
                renderizarProductos();
            } catch (err) {
                alert("Error al cargar el catálogo de productos");
            }
        }

        function renderizarProductos() {
            productosLista.innerHTML = "";
            catalogoProductos.forEach(prod => {
                const cantidadActual = carrito[prod.id] || 0;
                const div = document.createElement("div");
                div.className = "flex justify-between items-center border p-3 rounded-lg shadow-sm";
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold text-gray-800">${prod.nombre}</h4>
                        <p class="text-green-600 font-semibold">$${prod.precio.toFixed(2)}</p>
                        <p class="text-xs text-gray-500">Stock disponible: ${prod.stock}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button type="button" onclick="cambiarCantidad(${prod.id}, -1)" class="bg-gray-200 px-2.5 py-1 rounded font-bold">-</button>
                        <span id="cant-${prod.id}" class="w-6 text-center font-bold">${cantidadActual}</span>
                        <button type="button" onclick="cambiarCantidad(${prod.id}, 1)" class="bg-blue-600 text-white px-2.5 py-1 rounded font-bold">+</button>
                    </div>
                `;
                productosLista.appendChild(div);
            });
            actualizarTotal();
        }

        window.cambiarCantidad = function(productoId, delta) {
            const prod = catalogoProductos.find(p => p.id === productoId);
            if (!carrito[productoId]) carrito[productoId] = 0;

            const nuevaCantidad = carrito[productoId] + delta;
            if (nuevaCantidad >= 0 && nuevaCantidad <= prod.stock) {
                carrito[productoId] = nuevaCantidad;
                if (carrito[productoId] === 0) delete carrito[productoId];
                
                document.getElementById(`cant-${productoId}`).textContent = carrito[productoId] || 0;
                actualizarTotal();
            }
        }

        function actualizarTotal() {
            let total = 0;
            let totalItems = 0;

            for (let id in carrito) {
                const prod = catalogoProductos.find(p => p.id == id);
                total += prod.precio * carrito[id];
                totalItems += carrito[id];
            }

            totalPedidoElem.textContent = `$${total.toFixed(2)}`;
            btnEnviar.disabled = totalItems === 0;
        }

        btnEnviar.addEventListener("click", async () => {
            const items = Object.keys(carrito).map(id => ({
                producto_id: parseInt(id),
                cantidad: carrito[id]
            }));

            try {
                const res = await fetch(`${API_URL}/pedidos`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        cliente_id: clienteActual.id,
                        items: items
                    })
                });

                if (!res.ok) throw new Error("Error al registrar el pedido");

                const data = await res.json();
                alert(`¡Pedido #${data.pedido_id} enviado con éxito! Total: $${data.total}`);
                
                carrito = {};
                cargarCatalogo(clienteActual.tipo_precio);
            } catch (err) {
                alert("Hubo un error al procesar el pedido.");
            }
        });

        document.getElementById("btn-logout").addEventListener("click", () => {
            location.reload();
        });
    </script>
</body>
</html>
